<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STEPfwd Paste</title>
    <style>
        body {
            width: 320px;
            padding: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            width: 100%;
            height: 180px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input {
            width: 70px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h2>STEPfwd Paste</h2>

    <textarea id="text"
        placeholder="Paste your text here..."
        autofocus></textarea>

    <label>
        Keystroke delay (ms):
        <input id="delay" type="number"
               value="30" min="10" max="500">
    </label>

    <button id="send">Send Text to VM</button>

    <p id="status"></p>

    <script src="popup.js"></script>
</body>
</html>
